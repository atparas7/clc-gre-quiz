<script>
(function(){
  var WEEK = 4, ITER = 600000, SITE = "clc-gre-quiz", STORE = "clc_site_key";
  var te = new TextEncoder();
  function el(id){ return document.getElementById(id); }
  function bytes(b64){ return Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); }); }
  function b64(buf){ var s = "", a = new Uint8Array(buf); for (var i = 0; i < a.length; i += 32768) s += String.fromCharCode.apply(null, a.subarray(i, i + 32768)); return btoa(s); }
  function norm(s){ return String(s || "").normalize("NFC").trim(); }   // exactly as given: capitals, hyphens and spaces count
  var data = bytes(el("clc-payload").textContent.trim());
  function open(key){
    return crypto.subtle.decrypt({name: "AES-GCM", iv: data.slice(0, 12)}, key, data.slice(12)).then(function(plain){
      var html = new TextDecoder().decode(plain);
      return new Promise(function(done){
        function show(){                                       // replace this lock page by the real page
          document.open(); document.write(html); document.close(); done();
        }
        if (document.readyState === "complete") setTimeout(show, 0);   // document.open() is ignored while this page is still loading
        else window.addEventListener("load", function(){ setTimeout(show, 0); });
      });
    });
  }
  function fromPassword(pw){
    return crypto.subtle.importKey("raw", te.encode(norm(pw)), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: te.encode(SITE + ":week:" + WEEK), iterations: ITER},
        base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
    });
  }
  function ask(msg){
    el("clc-wait").style.display = "none"; el("clc-form").classList.remove("hide");
    el("clc-err").textContent = msg || ""; el("clc-pw").value = ""; el("clc-pw").focus();
  }
  function submit(){
    var pw = el("clc-pw").value; if (!norm(pw)){ ask("Please type the password."); return; }
    el("clc-go").disabled = true; el("clc-err").textContent = "Checking…";
    fromPassword(pw).then(function(key){
      return crypto.subtle.decrypt({name: "AES-GCM", iv: data.slice(0, 12)}, key, data.slice(12)).then(function(){ return key; });
    }).then(function(key){
      return crypto.subtle.exportKey("raw", key).then(function(raw){
        try{ sessionStorage.setItem(STORE, JSON.stringify({w: WEEK, k: b64(raw)})); }catch(e){}
        return open(key);
      });
    }).catch(function(){
      el("clc-go").disabled = false;
      ask("Wrong password. Type it exactly as you received it, with the hyphens. The password changes every Monday — ask your teacher for this week's password.");
    });
  }
  if (!window.crypto || !crypto.subtle){ ask("Please open this page in an up-to-date browser (Chrome, Safari, Edge or Firefox)."); return; }
  el("clc-go").addEventListener("click", submit);
  el("clc-pw").addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
  var saved = null; try{ saved = JSON.parse(sessionStorage.getItem(STORE) || "null"); }catch(e){}
  if (saved && saved.w === WEEK && saved.k){                 // signed in earlier in this tab, same week: open straight away
    el("clc-wait").style.display = "block";
    crypto.subtle.importKey("raw", bytes(saved.k), "AES-GCM", true, ["decrypt"]).then(open).catch(function(){
      try{ sessionStorage.removeItem(STORE); }catch(e){}
      ask("");
    });
  } else ask("");
})();
</script>
</body>
</html>
