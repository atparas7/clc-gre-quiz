<script>
/* ===== CLC results export =====
   After every test the student can save their score AND every answer as a PDF, a web page or an
   Excel (CSV) file. Each attempt is also kept on this device, so it can be downloaded again later
   from the "Saved results" button even after the tab was closed. */
(function(){
  "use strict";
  var STORE = "clc_gre_results_v1", KEEP = 40;
  var FILE = decodeURIComponent((location.pathname.split("/").pop() || "test").replace(/\.html?$/i, ""));
  var LOGO = "clc-logo.png";

  function has(n){ try{ return typeof eval(n) !== "undefined"; }catch(e){ return false; } }
  function get(n){ try{ return eval(n); }catch(e){ return undefined; } }

  /* ---------- text helpers ---------- */
  var decoder = document.createElement("textarea");
  function plain(s){
    s = String(s == null ? "" : s)
      .replace(/<br\s*\/?>/gi, " ").replace(/<\/(td|th|tr|p|div|li)>/gi, " ").replace(/<sup>(.*?)<\/sup>/gi, "^$1").replace(/<sub>(.*?)<\/sub>/gi, "_$1")
      .replace(/<[^>]*>/g, "");
    decoder.innerHTML = s; s = decoder.value;
    s = s.replace(/\\\(|\\\)|\\\[|\\\]/g, "")
      .replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, function(m, a, b){ var w = function(x){ return /^[\w.π√^\\]+$/.test(x) ? x : "(" + x + ")"; }; return w(a) + "/" + w(b); })
      .replace(/\\[dt]?frac\s*([0-9a-zA-Z])\s*([0-9a-zA-Z])/g, "$1/$2").replace(/\\sqrt\{([^{}]*)\}/g, "√($1)")
      .replace(/\\times/g, "×").replace(/\\cdot/g, "·").replace(/\\div/g, "÷").replace(/\\le(q)?\b/g, "≤").replace(/\\ge(q)?\b/g, "≥")
      .replace(/\\neq?\b/g, "≠").replace(/\\pi\b/g, "π").replace(/\\pm\b/g, "±").replace(/\\infty\b/g, "∞").replace(/\\dots|\\ldots/g, "…")
      .replace(/\\text\{([^{}]*)\}/g, "$1").replace(/\\(left|right|,|;|!|quad)/g, "").replace(/\\implies/g, "⇒").replace(/\\pmod\{?([^{} ]*)\}?/g, "(mod $1)")
      .replace(/\\\$/g, "$").replace(/[{}]/g, "").replace(/\s+/g, " ").trim();
    return s;
  }
  function short(s, n){ s = plain(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  function L(i){ return String.fromCharCode(65 + Number(i)); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  var NONE = "— (no answer)";

  /* ---------- collect every answer, per test family ---------- */
  function practiceRow(q, a, n, label){
    var ok;
    if (has("isCorrectAnswer")) ok = isCorrectAnswer(q, a);
    else if (has("rrIsCorrect")) ok = rrIsCorrect(q, a);
    else ok = calculateScore([q], [Array.isArray(a) ? a.slice() : a]) === 1;
    var yours = NONE, correct;
    if (q.type === "mc" || q.type === "qc"){
      if (a !== null && a !== undefined && a !== "") yours = L(a) + ". " + plain(q.choices[a]);
      correct = L(q.correct) + ". " + plain(q.choices[q.correct]);
    } else if (q.type === "ms"){
      if (Array.isArray(a) && a.length) yours = a.slice().sort(function(x,y){return x-y;}).map(function(i){ return L(i) + ". " + plain(q.choices[i]); }).join("; ");
      correct = q.correct.slice().sort(function(x,y){return x-y;}).map(function(i){ return L(i) + ". " + plain(q.choices[i]); }).join("; ");
    } else if (q.type === "fraction"){
      if (a && typeof a === "object"){ if ((a.num || "") !== "" || (a.den || "") !== "") yours = a.num + (a.den ? " / " + a.den : ""); }
      else if (typeof a === "string" && a.replace("/", "").trim() !== "") yours = a.replace(/\/$/, "");
      correct = plain(q.answer);
    } else {
      if (a !== null && a !== undefined && String(a).trim() !== "") yours = String(a);
      correct = plain(q.answer);
    }
    return {section: label, n: n, question: short(q.prompt || (q.table ? "A: " + q.table.qA + " | B: " + q.table.qB : ""), 260) +
      (q.table && q.prompt ? "  [A: " + plain(q.table.qA) + "  |  B: " + plain(q.table.qB) + "]" : ""), yours: yours, correct: correct, ok: !!ok};
  }

  function collect(){
    var sections = [];
    if (has("TESTS") && has("activeTest") && has("answers")){                     // Units 1–4
      var t = TESTS[activeTest], ans = get("answers"), rows = [];
      t.questions.forEach(function(q){
        var v = ans[q.n], ok = false, yours = NONE, correct;
        if (q.type === "numeric"){
          if (v !== undefined && v !== "") { yours = String(v); ok = checkNumeric(v, q.correct, q); }
          correct = String(q.correct);
        } else {
          if (v !== undefined && v !== ""){ var i = parseInt(v, 10); yours = L(i) + ". " + plain(q.choices[i]); ok = i === q.correct; }
          correct = L(q.correct) + ". " + plain(q.choices[q.correct]);
        }
        rows.push({section: t.title, n: q.n, question: short(q.prompt, 260), yours: yours, correct: correct, ok: ok});
      });
      sections.push({label: t.title, rows: rows});
      return {title: (has("TEST_NAME_PREFIX") ? TEST_NAME_PREFIX + " — " : "") + t.title, sections: sections};
    }
    if (has("DATA") && has("state") && has("flattenSection")){                     // Verbal adaptive
      var st = get("state");
      var mods = [{key: "module1", sec: DATA.module1}];
      if (st.module2Level) mods.push({key: st.module2Level === "hard" ? "module2_hard" : "module2_easy", sec: st.module2Level === "hard" ? DATA.module2_hard : DATA.module2_easy});
      mods.forEach(function(m){
        var items = flattenSection(m.sec), arr = st.answers[m.key] || [], rows = [];
        items.forEach(function(it, i){
          var a = arr[i];
          rows.push({section: m.sec.label, n: i + 1, question: short((it.passageTitle ? "[" + it.passageTitle + "] " : "") + (it.prompt || ""), 260),
            yours: formatAns(it, a) === "(no answer)" ? NONE : plain(formatAns(it, a)), correct: plain(formatAns(it, it.answer)), ok: isCorrectItem(it, a)});
        });
        sections.push({label: m.sec.label, rows: rows});
      });
      return {title: has("TEST_NAME") ? TEST_NAME : (DATA.testName || document.title), sections: sections};
    }
    if (has("SEC1_QUESTIONS") && has("answersSec1")){                               // Quant section-adaptive tests
      var r1 = SEC1_QUESTIONS.map(function(q, i){ return practiceRow(q, answersSec1[i], i + 1, "Section 1"); });
      sections.push({label: "Section 1", rows: r1});
      var s2 = get("activeQuestions"), a2 = get("answersSec2") || [];
      if (s2 && s2 !== SEC1_QUESTIONS && s2.length){
        var pool = "";
        if (has("SEC2_HARD") && s2 === SEC2_HARD) pool = " (Hard pool)"; else if (has("SEC2_EASY") && s2 === SEC2_EASY) pool = " (Easy pool)"; else if (has("SEC2_MEDIUM") && s2 === SEC2_MEDIUM) pool = " (Medium pool)";
        sections.push({label: "Section 2" + pool, rows: s2.map(function(q, i){ return practiceRow(q, a2[i], i + 1, "Section 2" + pool); })});
      }
      return {title: has("TEST_NAME") ? TEST_NAME : document.title, sections: sections};
    }
    return null;
  }

  /* ---------- storage ---------- */
  function load(){ try{ return JSON.parse(localStorage.getItem(STORE) || "[]"); }catch(e){ return []; } }
  function save(list){ try{ localStorage.setItem(STORE, JSON.stringify(list.slice(-KEEP))); return true; }catch(e){ return false; } }

  /* ---------- report builders ---------- */
  function athens(iso){
    try{ return new Date(iso).toLocaleString("el-GR", {timeZone: "Europe/Athens", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"}); }
    catch(e){ return iso; }
  }
  function reportHTML(r, autoPrint){
    var pct = r.max ? Math.round(100 * r.score / r.max) : 0;
    var secs = r.sections.map(function(s){
      var c = s.rows.filter(function(x){ return x.ok; }).length;
      return "<h2>" + esc(s.label) + " <span class='sub'>" + c + " / " + s.rows.length + " correct</span></h2>" +
        "<table><thead><tr><th>#</th><th>Question</th><th>Your answer</th><th>Correct answer</th><th></th></tr></thead><tbody>" +
        s.rows.map(function(x){
          return "<tr class='" + (x.ok ? "ok" : "no") + "'><td>" + esc(x.n) + "</td><td>" + esc(x.question) + "</td><td>" + esc(x.yours) +
            "</td><td>" + esc(x.correct) + "</td><td class='mark'>" + (x.ok ? "✓" : "✗") + "</td></tr>";
        }).join("") + "</tbody></table>";
    }).join("");
    return "<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'>" +
      "<title>" + esc(r.title + " — " + r.name) + "</title><style>" +
      "body{font-family:-apple-system,system-ui,'Segoe UI',Arial,sans-serif;color:#141a2b;margin:0;background:#fff;}" +
      ".wrap{max-width:900px;margin:0 auto;padding:28px 20px 40px;}" +
      "header{border-bottom:3px solid #7a1f2b;padding-bottom:14px;margin-bottom:18px;}" +
      ".brand{font-family:Georgia,serif;font-size:15px;color:#7a1f2b;letter-spacing:.04em;}" +
      "h1{font-family:Georgia,serif;font-size:22px;margin:6px 0 10px;}" +
      ".meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 18px;font-size:14px;color:#5b6472;}" +
      ".meta b{color:#141a2b;}" +
      ".score{margin:16px 0 6px;padding:16px;border-radius:12px;background:#f6ecd8;text-align:center;}" +
      ".score .num{font-family:Georgia,serif;font-size:34px;font-weight:700;color:#a9781f;}" +
      "h2{font-size:16px;margin:26px 0 8px;} h2 .sub{font-weight:400;color:#5b6472;font-size:13px;margin-left:6px;}" +
      "table{width:100%;border-collapse:collapse;font-size:12.5px;} th,td{border:1px solid #e2e5eb;padding:6px 7px;text-align:left;vertical-align:top;}" +
      "th{background:#f7f8fa;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#5b6472;}" +
      "td:first-child{width:28px;text-align:center;} tr.ok td.mark{color:#2f7d5a;} tr.no td.mark{color:#b4433a;} td.mark{font-weight:700;text-align:center;width:22px;font-size:15px;}" +
      "tr.no td:nth-child(3){color:#b4433a;} tr.ok td:nth-child(3){color:#2f7d5a;}" +
      "footer{margin-top:28px;font-size:11.5px;color:#9a958d;text-align:center;}" +
      "@media print{.wrap{padding:0;} tr{page-break-inside:avoid;} .score{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}" +
      "</style></head><body><div class='wrap'><header><div class='brand'>CLC EDUCATIONAL INSTITUTE · GRE PRACTICE</div>" +
      "<h1>" + esc(r.title) + "</h1><div class='meta'><div>Student: <b>" + esc(r.name) + "</b></div><div>Class / Τμήμα: <b>" + esc(r.section || "—") +
      "</b></div><div>Date: <b>" + esc(athens(r.when)) + "</b></div></div></header>" +
      (r.gre ? "<div class='score'><div style='font-size:12px;letter-spacing:.08em;color:#5b6472;'>GRE® " + esc(r.gre.measure || "").toUpperCase() + " — ESTIMATED SCORE (130–170)</div>" +
        "<div class='num' style='font-size:44px;'>" + r.gre.scaled + "</div><div>Percentile rank: <b>" + (r.gre.percentile > 0 ? r.gre.percentile : "<1") + "</b> · Raw score " + r.score + " / " + r.max +
        " (" + pct + "% correct) · Section 2: " + esc(r.gre.level) + "</div></div>"
        : "<div class='score'><div class='num'>" + r.score + " / " + r.max + "</div><div>" + pct + "% correct</div></div>") + secs +
      "<footer>© 2026 CLC Educational Institute — results report generated by the test page.</footer></div>" +
      (autoPrint ? "<script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script>" : "") + "</body></html>";
  }
  function reportCSV(r){
    function c(v){ v = String(v == null ? "" : v); return /[",\n;]/.test(v) ? "\"" + v.replace(/"/g, "\"\"") + "\"" : v; }
    var lines = [["Test", r.title], ["Student", r.name], ["Class", r.section || ""], ["Date", athens(r.when)], ["Score", r.score + " / " + r.max]].concat(r.gre ? [["GRE score (estimated 130-170)", r.gre.scaled], ["Percentile rank", r.gre.percentile]] : []).concat([[],
                 ["Section", "Question #", "Question", "Your answer", "Correct answer", "Result"]]);
    r.sections.forEach(function(s){ s.rows.forEach(function(x){ lines.push([s.label, x.n, x.question, x.yours, x.correct, x.ok ? "Correct" : "Wrong"]); }); });
    return "﻿" + lines.map(function(l){ return l.map(c).join(","); }).join("\r\n");
  }
  function fname(r, ext){
    var d = new Date(r.when), day = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    var clean = function(s){ return String(s).replace(/[\\\/:*?"<>|]+/g, "").replace(/\s+/g, "-").replace(/—/g, "-").replace(/-+/g, "-").slice(0, 60); };
    return "CLC-GRE_" + clean(r.title) + "_" + clean(r.name) + "_" + day + "." + ext;
  }
  function download(text, name, type){
    var blob = new Blob([text], {type: type}), url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }
  function asPDF(r){
    var w = null; try{ w = window.open("", "_blank"); }catch(e){}
    if (!w){ download(reportHTML(r, true), fname(r, "html"), "text/html;charset=utf-8"); return; }   // pop-up blocked: download instead
    w.document.open(); w.document.write(reportHTML(r, true)); w.document.close();
  }
  var ACT = {pdf: asPDF,
             html: function(r){ download(reportHTML(r, false), fname(r, "html"), "text/html;charset=utf-8"); },
             csv: function(r){ download(reportCSV(r), fname(r, "csv"), "text/csv;charset=utf-8"); }};

  /* ---------- UI ---------- */
  var css = document.createElement("style");
  css.textContent =
    ".clcx-bar{max-width:880px;margin:16px auto;padding:16px 18px;border:1px solid #e7ddc7;border-left:4px solid #7a1f2b;border-radius:12px;background:#faf6ec;font-family:-apple-system,system-ui,'Segoe UI',Arial,sans-serif;color:#1c2340;text-align:left;box-sizing:border-box;}" +
    ".clcx-bar h4{margin:0 0 4px;font-size:16px;font-family:Georgia,serif;} .clcx-bar p{margin:0 0 12px;font-size:13px;color:#5b6472;line-height:1.45;}" +
    ".clcx-btns{display:flex;flex-wrap:wrap;gap:8px;} .clcx-btn{border:1px solid #d9d2bd;background:#fff;color:#1c2340;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}" +
    ".clcx-btn.main{background:#7a1f2b;border-color:#7a1f2b;color:#fff;} .clcx-btn:hover{filter:brightness(.96);}" +
    ".clcx-fab{position:fixed;left:14px;bottom:14px;z-index:9998;border:none;background:#7a1f2b;color:#fff;border-radius:999px;padding:10px 16px;font:600 13px -apple-system,system-ui,Arial,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);}" +
    ".clcx-modal{position:fixed;inset:0;z-index:9999;background:rgba(20,26,43,.45);display:flex;align-items:center;justify-content:center;padding:16px;}" +
    ".clcx-panel{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px;font-family:-apple-system,system-ui,Arial,sans-serif;color:#1c2340;}" +
    ".clcx-panel h4{margin:0 0 4px;font-family:Georgia,serif;font-size:18px;} .clcx-item{border:1px solid #e2e5eb;border-radius:10px;padding:12px;margin-top:10px;}" +
    ".clcx-item .t{font-weight:600;font-size:14px;} .clcx-item .m{font-size:12.5px;color:#5b6472;margin:2px 0 8px;}" +
    "@media print{.clcx-bar,.clcx-fab,.clcx-modal{display:none!important;}}";
  document.head.appendChild(css);

  function buttons(r){
    var box = document.createElement("div"); box.className = "clcx-btns";
    [["pdf", "📄 Save as PDF", "main"], ["html", "⬇ Download (web page)", ""], ["csv", "⬇ Excel (CSV)", ""]].forEach(function(b){
      var btn = document.createElement("button"); btn.type = "button"; btn.className = "clcx-btn " + b[2]; btn.textContent = b[1];
      btn.onclick = function(){ ACT[b[0]](r); }; box.appendChild(btn);
    });
    return box;
  }
  function container(){
    return document.getElementById("resultBanner") || document.getElementById("resultsScreen") || document.getElementById("app") || document.body;
  }
  function showBar(r, saved){
    var old = document.querySelector(".clcx-bar"); if (old) old.remove();
    var bar = document.createElement("div"); bar.className = "clcx-bar";
    bar.innerHTML = "<h4>📥 Save your results</h4><p>Keep a copy of your score <b>and every answer</b>. " +
      (saved ? "A copy is also saved on this device — reopen this test and press <b>“Saved results”</b> to download it again." :
               "<b>Download it now</b> — this browser does not allow saving a copy on the device.") + "</p>";
    bar.appendChild(buttons(r));
    var c = container(); c.insertBefore(bar, c.firstChild);
    refreshFab();
  }
  function refreshFab(){
    var mine = load().filter(function(x){ return x.file === FILE; });
    var fab = document.querySelector(".clcx-fab");
    if (!mine.length){ if (fab) fab.remove(); return; }
    if (!fab){ fab = document.createElement("button"); fab.type = "button"; fab.className = "clcx-fab"; fab.onclick = openList; document.body.appendChild(fab); }
    fab.textContent = "📥 Saved results (" + mine.length + ")";
  }
  function openList(){
    var mine = load().filter(function(x){ return x.file === FILE; }).reverse();
    var m = document.createElement("div"); m.className = "clcx-modal";
    var p = document.createElement("div"); p.className = "clcx-panel";
    p.innerHTML = "<h4>📥 Saved results</h4><div style='font-size:13px;color:#5b6472;'>Results of this test saved on this device (newest first).</div>";
    mine.forEach(function(r){
      var it = document.createElement("div"); it.className = "clcx-item";
      it.innerHTML = "<div class='t'>" + esc(r.title) + "</div><div class='m'>" + esc(r.name) + (r.section ? " · " + esc(r.section) : "") +
        " · " + esc(athens(r.when)) + " · <b>" + r.score + " / " + r.max + "</b></div>";
      it.appendChild(buttons(r)); p.appendChild(it);
    });
    var close = document.createElement("button"); close.type = "button"; close.className = "clcx-btn"; close.style.marginTop = "14px"; close.textContent = "Close";
    close.onclick = function(){ m.remove(); }; p.appendChild(close);
    m.onclick = function(e){ if (e.target === m) m.remove(); };
    m.appendChild(p); document.body.appendChild(m);
  }

  /* ---------- hook: runs whenever the page reports a finished test ---------- */
  /* The answers travel to the teacher's Google Sheet together with the score, in the SAME request the page already sends
     (extra fields "percent", "level" and "answers"; an older Apps Script simply ignores them). */
  var pendingExtra = null;
  if (window.fetch && !window.__clcFetchWrapped){
    window.__clcFetchWrapped = true;
    var realFetch = window.fetch;
    window.fetch = function(url, opts){
      try{
        if (pendingExtra && typeof REPORT_WEBHOOK_URL !== "undefined" && String(url) === REPORT_WEBHOOK_URL && opts && opts.body instanceof URLSearchParams){
          Object.keys(pendingExtra).forEach(function(k){ opts.body.append(k, pendingExtra[k]); });
          pendingExtra = null;
        }
      }catch(e){}
      return realFetch.apply(this, arguments);
    };
  }
  function makeRecord(data, score, max, id){
    return {id: id || (Date.now() + "-" + Math.random().toString(36).slice(2, 7)), file: FILE, title: data.title, sections: data.sections,
            score: Number(score), max: Number(max), when: new Date().toISOString(),
            name: has("studentName") ? studentName : "", section: has("studentSection") ? studentSection : "",
            gre: window.CLC_GRE_SCORE ? {scaled: window.CLC_GRE_SCORE.scaled, percentile: window.CLC_GRE_SCORE.percentile, level: window.CLC_GRE_SCORE.level, measure: window.CLC_GRE_SCORE.measure} : undefined};
  }
  function sheetExtra(r){
    var level = r.sections.length > 1 ? r.sections[r.sections.length - 1].label : "";
    var rows = [];
    r.sections.forEach(function(s){ s.rows.forEach(function(x){
      rows.push({s: s.label, n: x.n, q: x.question.slice(0, 160), y: x.yours, c: x.correct, ok: x.ok ? 1 : 0});
    }); });
    var x = {percent: r.max ? Math.round(100 * r.score / r.max) : 0, level: level, answers: JSON.stringify(rows)};
    if (r.gre){ x.greScore = r.gre.scaled; x.percentile = r.gre.percentile; x.greMeasure = /verbal/i.test(r.gre.measure || "") ? "Verbal" : "Quant"; }
    return x;
  }

  var original = window.submitResultToSheet;
  window.submitResultToSheet = function(){
    var args = Array.prototype.slice.call(arguments);
    var score = args.length >= 3 ? args[1] : args[0], max = args.length >= 3 ? args[2] : args[1];
    var r = null;
    try{ var data = collect(); if (data){ r = makeRecord(data, score, max); pendingExtra = sheetExtra(r); } }catch(e){ if (window.console) console.error("CLC export:", e); }
    try{ if (typeof original === "function") original.apply(this, args); }catch(e){}
    pendingExtra = null;
    if (!r) return;
    setTimeout(function(){
      try{
        var list = load(); list.push(r); var ok = save(list);
        window.CLCExport.last = r;
        showBar(r, ok);
      }catch(e){ if (window.console) console.error("CLC export:", e); }
    }, 0);
  };
  function showOnly(score, max){            // re-opened, already-finished test: offer the download again, without re-saving
    setTimeout(function(){
      try{
        var data = collect(); if (!data) return;
        var r = {id: "view", file: FILE, title: data.title, sections: data.sections, score: Number(score), max: Number(max), when: new Date().toISOString(),
                 name: has("studentName") ? studentName : "", section: has("studentSection") ? studentSection : ""};
        showBar(r, true);
      }catch(e){ if (window.console) console.error("CLC export:", e); }
    }, 0);
  }
  window.CLCExport = {collect: collect, reportHTML: reportHTML, reportCSV: reportCSV, list: load, last: null, showOnly: showOnly, actions: ACT, athens: athens};
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", refreshFab); else refreshFab();
})();
</script>
<!--CLC-EXPORT-END-->

<!--CLC-LEAVE-GUARD-START-->
<script>
/* Tests now open in the same tab as the home page. If a student presses the browser's ← (or closes the tab)
   in the middle of a test, ask first — the answers of this test are not kept until it is finished. */
(function(){
  function visible(id){ var e = document.getElementById(id); return !!(e && e.offsetParent !== null); }
  function inProgress(){
    try{ if (typeof state !== "undefined" && state && state.screen) return ["section","sectionReview","routing"].indexOf(state.screen) > -1 && !state.finished; }catch(e){}
    return visible("testScreen") || visible("transScreen");
  }
  window.addEventListener("beforeunload", function(e){
    if (!inProgress()) return;
    e.preventDefault(); e.returnValue = "";
    return "";
  });
  window.CLCInProgress = inProgress;
})();
</script>
<!--CLC-LEAVE-GUARD-END-->
